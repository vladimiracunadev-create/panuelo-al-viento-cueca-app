name: Release Android y Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la release (debe ser v + la versión de pubspec.yaml)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  FLUTTER_VERSION: "3.44.6"

jobs:
  # La versión operativa sale de pubspec.yaml, nunca de un valor escrito a mano
  # en este archivo: si el tag y el manifiesto no coinciden, la release no sale.
  version:
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.resolve.outputs.app_version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      notes_path: ${{ steps.resolve.outputs.notes_path }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Resolver y comprobar la versión
        run: |
          APP_VERSION="$(node tool/app_version.mjs version)"
          BUILD_NUMBER="$(node tool/app_version.mjs build)"
          echo "pubspec.yaml declara $APP_VERSION+$BUILD_NUMBER"
          echo "El tag solicitado es $TAG_NAME"

          if [ "$TAG_NAME" != "v$APP_VERSION" ]; then
            echo "::error::El tag $TAG_NAME no corresponde a la versión v$APP_VERSION declarada en pubspec.yaml."
            exit 1
          fi

          NOTES_PATH="docs/releases/${TAG_NAME}.md"
          if [ ! -f "$NOTES_PATH" ]; then
            echo "::error::Faltan las notas de publicación en $NOTES_PATH."
            exit 1
          fi

          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "notes_path=$NOTES_PATH" >> "$GITHUB_OUTPUT"

  quality:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: node tool/validate_repository.mjs
      - run: node tool/validate_curriculum.mjs
      - run: node tool/build_site.mjs
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    needs: [version, quality]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Generar Android reproduciblemente
        run: |
          flutter create --project-name panuelo_al_viento --org cl.panueloalviento --platforms=android,windows --no-pub .
          node tool/configure_platforms.mjs
          flutter pub get
          dart run flutter_launcher_icons
      - name: Preparar firma Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/panuelo-signing"
          KEYSTORE="$RUNNER_TEMP/panuelo-signing/release.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
            echo "Firma persistente configurada mediante GitHub Secrets."
          else
            KEY_ALIAS="panuelo"
            KEY_PASSWORD="panuelo-temporal-010"
            STORE_PASSWORD="panuelo-temporal-010"
            keytool -genkeypair -v -keystore "$KEYSTORE" -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Panuelo al Viento, OU=Educacion, O=Vladimir Acuna, L=Santiago, C=CL"
            echo "::warning::Se usa una firma efímera. Configura los cuatro secrets Android antes de una actualización."
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE
          EOF
          node tool/configure_android_signing.mjs
      - name: Compilar APK universal
        run: flutter build apk --release
      - name: Auditar permisos en el manifiesto fuente
        run: |
          if grep -R -E "android.permission.(CAMERA|RECORD_AUDIO)" android/app/src; then
            echo "::error::Se detectó un permiso no autorizado de cámara o micrófono."
            exit 1
          fi
      - name: Verificar el APK compilado
        run: |
          node tool/verify_apk.mjs \
            build/app/outputs/flutter-apk/app-release.apk \
            "$APP_VERSION"
      - name: Verificar la firma
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose build/app/outputs/flutter-apk/app-release.apk
      - name: Preparar artefacto
        run: |
          mkdir release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "release-artifacts/PanueloAlViento-${APP_VERSION}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*
          if-no-files-found: error

  windows:
    needs: [version, quality]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Generar Windows reproduciblemente
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --project-name panuelo_al_viento --org cl.panueloalviento --platforms=android,windows --no-pub .
          node tool/configure_platforms.mjs
          flutter pub get
          dart run flutter_launcher_icons
      - name: Compilar aplicación
        run: flutter build windows --release
      - name: Prueba de arranque
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/windows/x64/runner/Release/panuelo_al_viento.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited -and $process.ExitCode -ne 0) {
            throw "La aplicación terminó con código $($process.ExitCode)."
          }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id }
      - name: Comprobar la versión del ejecutable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'build/windows/x64/runner/Release/panuelo_al_viento.exe'
          $info = (Get-Item $exe).VersionInfo
          $info | Format-List ProductName, FileVersion, ProductVersion, CompanyName
          if ($info.ProductVersion -notlike "$env:APP_VERSION*") {
            throw "El ejecutable declara ProductVersion $($info.ProductVersion) y se esperaba $env:APP_VERSION."
          }
      - name: Preparar versión portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath "release-artifacts/PanueloAlViento-$env:APP_VERSION-Windows-portable.zip"
      - name: Instalar herramientas de empaquetado
        shell: pwsh
        run: |
          choco install innosetup wixtoolset --yes --no-progress
      - name: Crear instalador EXE
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $outputDir = (Resolve-Path 'release-artifacts').Path
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$env:APP_VERSION" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" 'packaging/windows/installer.iss'
      - name: Crear instalador MSI
        shell: pwsh
        run: |
          $wix = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (-not (Test-Path $wix)) { $wix = 'C:\Program Files (x86)\WiX Toolset v3.11\bin' }
          New-Item -ItemType Directory -Force -Path build/wix | Out-Null
          & "$wix\heat.exe" dir 'build/windows/x64/runner/Release' -cg AppFiles -dr INSTALLFOLDER -srd -gg -sfrag -sreg -var var.SourceDir -out build/wix/files.wxs
          & "$wix\candle.exe" -arch x64 "-dAppVersion=$env:APP_VERSION" '-dSourceDir=build\windows\x64\runner\Release' packaging/windows/product.wxs build/wix/files.wxs -out build/wix/
          & "$wix\light.exe" -ext WixUIExtension build/wix/product.wixobj build/wix/files.wixobj -pdbout "build/wix/PanueloAlViento-$env:APP_VERSION-Windows.wixpdb" -out "release-artifacts/PanueloAlViento-$env:APP_VERSION-Windows.msi"
      - name: Verificar artefactos
        shell: pwsh
        run: |
          $expected = @(
            "PanueloAlViento-$env:APP_VERSION-Windows-portable.zip",
            "PanueloAlViento-$env:APP_VERSION-Windows-Setup.exe",
            "PanueloAlViento-$env:APP_VERSION-Windows.msi"
          )
          $files = @(Get-ChildItem release-artifacts -File)
          $files | Format-Table Name, Length
          foreach ($name in $expected) {
            if (-not (Test-Path "release-artifacts/$name")) { throw "Falta el artefacto $name." }
          }
          $unexpected = @($files | Where-Object Name -NotIn $expected)
          if ($unexpected.Count -gt 0) { throw "Artefactos inesperados: $($unexpected.Name -join ', ')." }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    needs: [version, android, windows]
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - name: Comprobar que los cuatro artefactos llevan la versión correcta
        run: |
          ls -l release-assets
          for suffix in Android.apk Windows-Setup.exe Windows.msi Windows-portable.zip; do
            name="PanueloAlViento-${APP_VERSION}-${suffix}"
            if [ ! -f "release-assets/$name" ]; then
              echo "::error::Falta el artefacto $name."
              exit 1
            fi
            echo "presente $name"
          done
          extra="$(find release-assets -maxdepth 1 -type f ! -name "PanueloAlViento-${APP_VERSION}-*")"
          if [ -n "$extra" ]; then
            echo "::error::Artefactos con una versión distinta a ${APP_VERSION}:"
            echo "$extra"
            exit 1
          fi
      - name: Checksums SHA-256
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Pañuelo al Viento ${{ env.TAG_NAME }}"
          body_path: ${{ needs.version.outputs.notes_path }}
          files: release-assets/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
