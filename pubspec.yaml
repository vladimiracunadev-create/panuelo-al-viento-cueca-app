name: panuelo_al_viento
description: Aplicación educativa local-first para que niñas y niños aprendan cueca jugando.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/content/curriculum.json
    - assets/branding/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/branding/app-icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#F7EFE3"
  adaptive_icon_foreground: "assets/branding/app-icon.png"
  windows:
    generate: true
    image_path: "assets/branding/app-icon.png"
    icon_size: 256
